<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Omniverse — AI Tools Marketplace</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><img src="assets/logo.svg" alt="Omniverse" style="height:28px;vertical-align:middle"> <span style="margin-left:8px">Omniverse</span></div>
      <div class="tag">AI Tools Marketplace — Free hosting · Donation-ready</div>
    </div>
    <nav>
      <button id="btnDonate" class="btn">Donate / Pay</button>
      <button id="btnOwner" class="btn subtle">Owner: Set Premium Key</button>
    </nav>
  </div>
</header>

<main class="container">
  <section class="intro card">
    <h1>Omniverse AI Marketplace — Hybrid (Marketplace + Services + Agents)</h1>
    <p class="muted">Start free: try tools, download outputs. To accept payments, add your PayPal / Ko-fi / UPI links in Settings (owner). For pay-per-download you can ask buyers to send a transaction ID and then give them the unlock key.</p>
  </section>

  <section class="tools-grid" id="toolsGrid">
    <!-- dynamic tools inserted here -->
  </section>

  <section class="card" id="analyticsCard">
    <h3>Usage Summary (local)</h3>
    <div id="analyticsList" class="muted">No activity yet.</div>
  </section>
</main>

<!-- Donates / Payment modal -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button class="close" id="modalClose">&times;</button>
    <h3>Donate / Pay — Options</h3>
    <p>Place your payment links below (owner can update these in the prompt box):</p>
    <div>
      <label>PayPal.Me or full PayPal link</label>
      <input id="inputPayPal" placeholder="https://paypal.me/yourname or https://www.paypal.com/paypalme/..." />
      <label>Ko-fi / Buy Me a Coffee</label>
      <input id="inputKofi" placeholder="https://ko-fi.com/yourname" />
      <label>UPI (text) — show to users as copyable text</label>
      <input id="inputUPI" placeholder="yourupi@bank or UPI deep link" />
      <small class="muted">Fill these and click Save (Owner only). They are stored in browser localStorage for this device. For real production, store server-side.</small>
      <div style="margin-top:10px;text-align:right">
        <button id="savePayment" class="btn">Save (owner)</button>
      </div>
    </div>
  </div>
</div>

<!-- Owner premium-key modal -->
<div id="ownerModal" class="modal hidden">
  <div class="modal-content">
    <button class="close" id="ownerClose">&times;</button>
    <h3>Owner: Set / Remove Premium Unlock Key</h3>
    <p class="muted">This is a simple manual workflow for zero-cost monetization: when a buyer pays externally (PayPal/UPI/etc), you give them a one-time unlock key to enable premium downloads.</p>
    <label>Set Premium Key (example: OMNI-2025-XYZ)</label>
    <input id="premiumKeyInput" placeholder="Type a key (case-sensitive)"/>
    <div style="margin-top:8px;text-align:right">
      <button id="saveKey" class="btn">Save Key</button>
      <button id="removeKey" class="btn subtle">Remove Key</button>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="wrap muted small">Built for zero-cost launch. Owner: add your payment links and premium key in Settings. Want me to integrate automatic payment verification later? Ask and I will build the serverless flow.</div>
</footer>

<script src="scripts/tools.js"></script>
<script src="scripts/ui.js"></script>
<script src="scripts/analytics.js"></script>
<script src="scripts/payments.js"></script>
<script>
  OmniUI.init();
</script>
</body>
